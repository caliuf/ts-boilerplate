name: scheduled

# Guards and slow-lane checks (Vademecum §10). Report-only: findings become
# issues, never code changes or commits.

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # tag: v3
      - run: pnpm install --frozen-lockfile
      - name: Run guards (report-only)
        run: just guards | tee guards-report.md
      - name: Upload report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # tag: v5
        with:
          name: guards-report
          path: guards-report.md
          retention-days: 30
      - name: Open issue on findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "❌" guards-report.md; then
            gh issue create \
              --title "Guards report: findings ($(date -u +%Y-%m-%d))" \
              --body-file guards-report.md
          else
            echo "No findings."
          fi

  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # tag: v3
      - run: lychee --no-progress --exclude-loopback .
