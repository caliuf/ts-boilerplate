name: scheduled

# Guards and slow-lane checks (Vademecum §10). Report-only: findings become
# issues, never code changes or commits.

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # tag: v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: Run guards (report-only)
        run: just guards | tee guards-report.md
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag: v7.0.1
        with:
          name: guards-report
          path: guards-report.md
          retention-days: 30
      - name: Open issue on findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "❌" guards-report.md; then
            gh issue create \
              --title "Guards report: findings ($(date -u +%Y-%m-%d))" \
              --body-file guards-report.md
          else
            echo "No findings."
          fi

  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag: v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # tag: v4.3.0
      - run: lychee --no-progress --exclude-loopback .
