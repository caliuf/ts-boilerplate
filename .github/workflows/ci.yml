name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # tag: v3
      - run: pnpm install --frozen-lockfile
      - run: just format-check lint typecheck dead-code arch docs-check workflows-check secrets

  integration-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # tag: v3
      - run: pnpm install --frozen-lockfile
      - run: just test-unit test-integration smoke coverage

  bun-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # tag: v3
      - run: pnpm install --frozen-lockfile
      - run: just bun-smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # tag: v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @project/tests exec playwright install --with-deps chromium
      - run: just test-e2e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # tag: v5
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Dependency Review requires GitHub Advanced Security on private repos.
  # Self-skips there; enable GHAS (Settings → Code security) and remove the
  # second condition to activate it.
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@e7aeea1772ec01da74cafda11c5caa463520ca59 # tag: v3
