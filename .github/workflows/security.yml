name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # tag: v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # tag: v4

  secrets-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # tag: v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # tag: v3
      - run: gitleaks git --redact --no-banner .
