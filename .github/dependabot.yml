version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Raggruppa patch/minor compatibili; le major non ignorate restano separate per review.
      patch-and-minor:
        update-types: ["patch", "minor"]
    ignore:
      # Le major di @types/node seguono il runtime e si aggiornano nella PR dedicata (ADR-0010).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
