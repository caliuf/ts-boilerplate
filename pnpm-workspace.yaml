packages:
  - "apps/*"
  - "packages/*"
  - "tests"

# dependency-cruiser needs the TypeScript compiler API, unpublished in TS 7
# (ADR-0001). It gets TypeScript 6 affiancato until TS 7 support lands.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

minimumReleaseAgeExclude:
  - dependency-cruiser@18.8.0
  - lucide-react@1.74.0
  - "@hono/node-server@2.1.9"
